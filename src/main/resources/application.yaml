spring:
  application:
    name: back
  datasource:
    url: jdbc:h2:./db_dev;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  output:
    ansi:
      enabled: always
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true # SQL에 줄바꿈과 들여쓰기를 적용
        highlight_sql: true # 콘솔이 색상을 지원하면 SQL 문법을 색상으로 강조
        use_sql_comments: true # 어떤 작업으로 생성된 SQL인지 파악할 수 있도록 주석을 붙인다
logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE
